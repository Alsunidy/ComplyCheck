[pytest]
testpaths = tests
# Integration tests hit the real OpenAI API; they self-skip without a key,
# and this keeps them out of the default run even when one is present.
addopts = -m "not integration" --strict-markers
markers =
    integration: hits the real OpenAI API (needs OPENAI_API_KEY)
filterwarnings =
    ignore::DeprecationWarning:reportlab.*
